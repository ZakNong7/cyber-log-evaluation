<svg viewBox="0 0 460 296" width="460" height="296" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram Alur Metodologi Penelitian 4-Fase">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
  </defs>

  <!-- Background: Pure Solid White -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Connecting Arrows -->
  <line x1="230" y1="64" x2="230" y2="85" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="230" y1="135" x2="230" y2="156" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="230" y1="206" x2="230" y2="227" stroke="#000000" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Box 1 -->
  <rect x="25" y="16" width="410" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="230" y="36" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">1. Ingesti Data &amp; Audit Distribusi Statistik (RQ1)</text>
  <text x="230" y="53" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="10.2" text-anchor="middle">40.000 log (1.380 hari), batas pencilan IQR, &amp; 13 uji Chi-Square / KS</text>

  <!-- Box 2 -->
  <rect x="25" y="87" width="410" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="230" y="107" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">2. Karakterisasi Struktur Temporal Deret Waktu (RQ2)</text>
  <text x="230" y="124" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="10.2" text-anchor="middle">Agregasi harian, uji dispersi Poisson, ACF, Ljung-Box, &amp; Mann-Kendall</text>

  <!-- Box 3 -->
  <rect x="25" y="158" width="410" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="230" y="178" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">3. Pemisahan Data Kronologis Murni 80/20 (RQ2 &amp; RQ3)</text>
  <text x="230" y="195" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="10.2" text-anchor="middle">1.104 hari latih, 276 hari uji terisolasi, &amp; Walk-Forward CV 5-lipatan</text>

  <!-- Box 4 -->
  <rect x="25" y="229" width="410" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="230" y="249" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">4. Evaluasi Model vs Baseline Pembanding (RQ2 &amp; RQ3)</text>
  <text x="230" y="266" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="10.2" text-anchor="middle">Polinomial Ordo 1–3, Random Forest, Baseline Naif, &amp; Uji Binomial Tepat</text>
</svg>
