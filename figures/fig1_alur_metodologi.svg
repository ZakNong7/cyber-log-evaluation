<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="metodologi-title metodologi-desc" id="fig1_alur_metodologi-root">
        <title id="metodologi-title">Diagram Alur Metodologi Modular 4-Fase</title>
        <desc id="metodologi-desc">Diagram alur metodologi penelitian mencakup ingesti data dan audit univariat, karakterisasi struktur temporal, protokol partisi bebas kebocoran data, serta evaluasi model terhadap baseline pembanding objektif.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #fig1_alur_metodologi-root { --color-paper:   #ffffff;
      --color-paper-2: #f8fafc;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-rule:    rgba(15, 23, 42, 0.12);
      --color-rule-solid: #cbd5e1;
      --color-accent:  #0284c7;
      --color-accent-tint: rgba(2, 132, 199, 0.05);
      --font-sans:     'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #fig1_alur_metodologi-root { font-family: var(--font-sans); color: var(--color-ink); }
      #fig1_alur_metodologi-root .diagram-container { width: 100%;
      overflow-x: auto; }
      @media print {
#fig1_alur_metodologi-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="fig1_alur_metodologi-dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="10" cy="10" r="0.75" fill="#0f172a" fill-opacity="0.06"/>
          </pattern>
          <marker id="fig1_alur_metodologi-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
          </marker>
          <marker id="fig1_alur_metodologi-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="100%" height="100%" fill="#ffffff"/>
        <rect width="100%" height="100%" fill="url(#fig1_alur_metodologi-dots)" opacity="0.65"/>

        <!-- Connectors (drawn before nodes so they sit behind) -->
        <!-- FASE 1 -> FASE 2 -->
        <line x1="480" y1="180" x2="480" y2="212" stroke="#64748b" stroke-width="1.5" marker-end="url(#fig1_alur_metodologi-arrow)"/>
        
        <!-- FASE 2 -> FASE 3 (Entering Focal Phase) -->
        <line x1="480" y1="344" x2="480" y2="376" stroke="#0284c7" stroke-width="1.5" marker-end="url(#fig1_alur_metodologi-arrow-accent)"/>
        
        <!-- FASE 3 -> FASE 4 (Exiting Focal Phase) -->
        <line x1="480" y1="508" x2="480" y2="540" stroke="#0284c7" stroke-width="1.5" marker-end="url(#fig1_alur_metodologi-arrow-accent)"/>

        <!-- ========================================== -->
        <!-- FASE 1 CARD (y: 48 to 180, height: 132)     -->
        <!-- ========================================== -->
        <g id="card-fase-1">
          <!-- Opaque mask & card box -->
          <rect x="48" y="48" width="864" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          
          <!-- Header: Badge, Tag, Title -->
          <rect x="68" y="62" width="76" height="22" rx="4" fill="#0f172a"/>
          <text x="106" y="77" fill="#ffffff" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.08em">FASE 1</text>
          
          <rect x="152" y="63" width="46" height="20" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
          <text x="175" y="77" fill="#475569" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">RQ1</text>
          
          <text x="210" y="78" fill="#0f172a" font-family="'Geist', sans-serif" font-size="13.5" font-weight="600">Ingesti Data &amp; Audit Distribusi Statistik</text>
          
          <!-- Divider line -->
          <line x1="68" y1="92" x2="892" y2="92" stroke="#0f172a" stroke-width="1" stroke-opacity="0.08"/>
          
          <!-- Bullets -->
          <circle cx="76" cy="107" r="2.2" fill="#0284c7"/>
          <text x="88" y="111" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">Korpus 40.000 log keamanan siber (1.380 hari kalender kontinu, 2020–2023)</text>
          
          <circle cx="76" cy="124" r="2.2" fill="#0284c7"/>
          <text x="88" y="128" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">Audit integritas: 0 timestamp rusak, 0 baris duplikat, verifikasi missing value</text>
          
          <circle cx="76" cy="141" r="2.2" fill="#0284c7"/>
          <text x="88" y="145" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">Eksplorasi batas pencilan non-parametrik IQR [LB, UB] pada korpus utuh (Tabel 1)</text>
          
          <circle cx="76" cy="158" r="2.2" fill="#0284c7"/>
          <text x="88" y="162" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">13 Uji Goodness-of-Fit univariat (Chi-Square &amp; KS) vs distribusi seragam (α_adj = 0,0038)</text>
        </g>

        <!-- ========================================== -->
        <!-- FASE 2 CARD (y: 212 to 344, height: 132)    -->
        <!-- ========================================== -->
        <g id="card-fase-2">
          <!-- Opaque mask & card box -->
          <rect x="48" y="212" width="864" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          
          <!-- Header: Badge, Tag, Title -->
          <rect x="68" y="226" width="76" height="22" rx="4" fill="#0f172a"/>
          <text x="106" y="241" fill="#ffffff" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.08em">FASE 2</text>
          
          <rect x="152" y="227" width="46" height="20" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
          <text x="175" y="241" fill="#475569" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">RQ2</text>
          
          <text x="210" y="242" fill="#0f172a" font-family="'Geist', sans-serif" font-size="13.5" font-weight="600">Karakterisasi Struktur Temporal Deret Waktu</text>
          
          <!-- Divider line -->
          <line x1="68" y1="256" x2="892" y2="256" stroke="#0f172a" stroke-width="1" stroke-opacity="0.08"/>
          
          <!-- Bullets -->
          <circle cx="76" cy="271" r="2.2" fill="#0284c7"/>
          <text x="88" y="275" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">Agregasi frekuensi serangan harian (DDoS, Malware, dan Intrusion)</text>
          
          <circle cx="76" cy="288" r="2.2" fill="#0284c7"/>
          <text x="88" y="292" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">Uji dispersi Poisson (evaluasi sifat ekuidispersi s² / x̄ ≈ 1 proses tanpa memori)</text>
          
          <circle cx="76" cy="305" r="2.2" fill="#0284c7"/>
          <text x="88" y="309" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">Analisis autokorelasi serial ACF (lag 1–20) &amp; uji portmanteau Ljung-Box Q(20)</text>
          
          <circle cx="76" cy="322" r="2.2" fill="#0284c7"/>
          <text x="88" y="326" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">Uji tren deterministik Mann-Kendall &amp; uji siklus musiman Kruskal-Wallis</text>
        </g>

        <!-- ========================================== -->
        <!-- FASE 3 CARD (FOCAL) (y: 376 to 508, h: 132) -->
        <!-- ========================================== -->
        <g id="card-fase-3">
          <!-- Focal Card with Accent Tint & Border -->
          <rect x="48" y="376" width="864" height="132" rx="8" fill="#0284c7" stroke="#0284c7" stroke-width="1.5" fill-opacity="0.04"/>
          
          <!-- Header: Badge, Tag, Title -->
          <rect x="68" y="390" width="76" height="22" rx="4" fill="#0284c7"/>
          <text x="106" y="405" fill="#ffffff" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.08em">FASE 3</text>
          
          <rect x="152" y="391" width="76" height="20" rx="3" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
          <text x="190" y="405" fill="#0369a1" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">RQ2 &amp; RQ3</text>
          
          <text x="238" y="406" fill="#0f172a" font-family="'Geist', sans-serif" font-size="13.5" font-weight="600">Protokol Partisi Kronologis Bebas Kebocoran Data</text>
          
          <rect x="736" y="391" width="156" height="20" rx="3" fill="#0284c7" stroke="#0284c7" stroke-width="1" fill-opacity="0.12" stroke-opacity="0.3"/>
          <text x="814" y="405" fill="#0284c7" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" text-anchor="middle" letter-spacing="0.05em">★ KONTRIBUSI UTAMA</text>
          
          <!-- Divider line -->
          <line x1="68" y1="420" x2="892" y2="420" stroke="#0284c7" stroke-width="1" stroke-opacity="0.18"/>
          
          <!-- Bullets -->
          <circle cx="76" cy="435" r="2.2" fill="#0284c7"/>
          <text x="88" y="439" fill="#0f172a" font-family="'Geist', sans-serif" font-size="10.5" font-weight="500">Pembagian temporal kronologis 80/20 tanpa peracakan data (strictly no random shuffling)</text>
          
          <circle cx="76" cy="452" r="2.2" fill="#0284c7"/>
          <text x="88" y="456" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">Data latih: 1.104 hari (2020 s.d. 8 Jan 2023) | Data uji: 276 hari (9 Jan s.d. 11 Okt 2023)</text>
          
          <circle cx="76" cy="469" r="2.2" fill="#0284c7"/>
          <text x="88" y="473" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">Penskalaan fitur &amp; batas atas IQR clipping dihitung murni train-only bebas kebocoran</text>
          
          <circle cx="76" cy="486" r="2.2" fill="#0284c7"/>
          <text x="88" y="490" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">Validasi silang walk-forward (expanding window) 5-lipatan pada horizon peramalan</text>
        </g>

        <!-- ========================================== -->
        <!-- FASE 4 CARD (y: 540 to 672, height: 132)    -->
        <!-- ========================================== -->
        <g id="card-fase-4">
          <!-- Opaque mask & card box -->
          <rect x="48" y="540" width="864" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          
          <!-- Header: Badge, Tag, Title -->
          <rect x="68" y="554" width="76" height="22" rx="4" fill="#0f172a"/>
          <text x="106" y="569" fill="#ffffff" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.08em">FASE 4</text>
          
          <rect x="152" y="555" width="76" height="20" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
          <text x="190" y="569" fill="#475569" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">RQ2 &amp; RQ3</text>
          
          <text x="238" y="570" fill="#0f172a" font-family="'Geist', sans-serif" font-size="13.5" font-weight="600">Evaluasi Model vs Baseline Pembanding Objektif</text>
          
          <!-- Divider line -->
          <line x1="68" y1="584" x2="892" y2="584" stroke="#0f172a" stroke-width="1" stroke-opacity="0.08"/>
          
          <!-- Bullets -->
          <circle cx="76" cy="599" r="2.2" fill="#0284c7"/>
          <text x="88" y="603" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">Peramalan: Regresi Polinomial (Ordo 1–3) vs Baseline Rata-rata Latih, Nilai Akhir, &amp; Persistence</text>
          
          <circle cx="76" cy="616" r="2.2" fill="#0284c7"/>
          <text x="88" y="620" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">Evaluasi R² out-of-sample pada data uji unseen &amp; pembuktian divergensi ekstrapolasi</text>
          
          <circle cx="76" cy="633" r="2.2" fill="#0284c7"/>
          <text x="88" y="637" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">Klasifikasi: Random Forest (300 pohon) vs Baseline Tebakan Acak (1/3) &amp; Kelas Mayoritas</text>
          
          <circle cx="76" cy="650" r="2.2" fill="#0284c7"/>
          <text x="88" y="654" fill="#334155" font-family="'Geist', sans-serif" font-size="10.5">Uji Binomial Tepat satu sisi, Matriks Kebingungan, &amp; Bobot Kepentingan Fitur MDI</text>
        </g>

        <!-- ========================================== -->
        <!-- LEGEND STRIP (y: 696 to 732, height: 36)   -->
        <!-- ========================================== -->
        <g id="legend-strip">
          <rect x="48" y="696" width="864" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          
          <!-- Legend item 1: Standard Step -->
          <rect x="68" y="707" width="14" height="14" rx="3" fill="#0f172a"/>
          <text x="90" y="718" fill="#475569" font-family="'Geist', sans-serif" font-size="9.5">Tahap Eksperimen</text>
          
          <!-- Legend item 2: Focal Step -->
          <rect x="216" y="707" width="14" height="14" rx="3" fill="#0284c7"/>
          <text x="238" y="718" fill="#0369a1" font-family="'Geist', sans-serif" font-size="9.5" font-weight="600">Kontribusi Bebas Kebocoran Data (Fase 3)</text>
          
          <!-- Legend item 3: RQ Scope Mapping -->
          <text x="892" y="718" fill="#64748b" font-family="'Geist Mono', monospace" font-size="9" text-anchor="end">Pemetaan: RQ1 (Distribusi) · RQ2 (Temporal) · RQ3 (Prediktif)</text>
        </g>
      </svg>
