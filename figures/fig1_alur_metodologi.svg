<svg viewBox="0 0 780 525" width="780" height="525" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram Alur Metodologi Modular 4-Fase">
  <defs>
    <marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0f172a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Background Canvas: Pure Solid White -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ==================================================== -->
  <!-- CONNECTING ARROWS (Drawn behind cards)               -->
  <!-- ==================================================== -->
  <!-- Fase 1 -> Fase 2 -->
  <line x1="390" y1="125" x2="390" y2="145" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  
  <!-- Fase 2 -> Fase 3 -->
  <line x1="390" y1="250" x2="390" y2="270" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  
  <!-- Fase 3 -> Fase 4 -->
  <line x1="390" y1="380" x2="390" y2="400" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- ==================================================== -->
  <!-- FASE 1: Ingesti & Audit Distribusi                   -->
  <!-- ==================================================== -->
  <g id="fase-1">
    <rect x="25" y="20" width="730" height="105" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <path d="M 25 26 Q 25 20 31 20 L 749 20 Q 755 20 755 26 L 755 50 L 25 50 Z" fill="#0f172a"/>
    <text x="40" y="41" fill="#ffffff" font-family="'Times New Roman', Georgia, serif" font-size="14.5" font-weight="bold" letter-spacing="0.02em">FASE 1: Ingesti Data &amp; Audit Distribusi Statistik (RQ1)</text>
    
    <circle cx="44" cy="67" r="3" fill="#0f172a"/>
    <text x="56" y="71" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="13">Korpus 40.000 log keamanan siber publik (rentang waktu 1.380 hari kalender, 25 atribut heterogen)</text>
    
    <circle cx="44" cy="85" r="3" fill="#0f172a"/>
    <text x="56" y="89" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="13">Audit integritas data &amp; eksplorasi batas pencilan IQR [LB, UB] (0 timestamp cacat, 0 baris duplikat)</text>
    
    <circle cx="44" cy="103" r="3" fill="#0f172a"/>
    <text x="56" y="107" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="13">13 Uji Goodness-of-Fit univariat (Chi-Square &amp; Kolmogorov-Smirnov) vs seragam (α_adj = 0,0038)</text>
  </g>

  <!-- ==================================================== -->
  <!-- FASE 2: Struktur Temporal                            -->
  <!-- ==================================================== -->
  <g id="fase-2">
    <rect x="25" y="145" width="730" height="105" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <path d="M 25 151 Q 25 145 31 145 L 749 145 Q 755 145 755 151 L 755 175 L 25 175 Z" fill="#0f172a"/>
    <text x="40" y="166" fill="#ffffff" font-family="'Times New Roman', Georgia, serif" font-size="14.5" font-weight="bold" letter-spacing="0.02em">FASE 2: Karakterisasi Struktur Temporal Deret Waktu (RQ2)</text>
    
    <circle cx="44" cy="192" r="3" fill="#0f172a"/>
    <text x="56" y="196" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="13">Agregasi frekuensi serangan harian deret waktu (DDoS, Malware, Intrusion) selama 1.380 hari</text>
    
    <circle cx="44" cy="210" r="3" fill="#0f172a"/>
    <text x="56" y="214" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="13">Uji dispersi Poisson (evaluasi rasio varians/rata-rata s²/x̄ ≈ 1 sebagai sifat proses tanpa memori)</text>
    
    <circle cx="44" cy="228" r="3" fill="#0f172a"/>
    <text x="56" y="232" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="13">Analisis autokorelasi serial ACF (lag 1–20), uji portmanteau Ljung-Box, &amp; uji tren Mann-Kendall</text>
  </g>

  <!-- ==================================================== -->
  <!-- FASE 3: Partisi Bebas Kontaminasi (Focal)           -->
  <!-- ==================================================== -->
  <g id="fase-3">
    <rect x="25" y="270" width="730" height="110" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
    <path d="M 25 276 Q 25 270 31 270 L 749 270 Q 755 270 755 276 L 755 302 L 25 302 Z" fill="#0284c7"/>
    <text x="40" y="292" fill="#ffffff" font-family="'Times New Roman', Georgia, serif" font-size="14.5" font-weight="bold" letter-spacing="0.02em">FASE 3: Protokol Partisi Temporal Bebas Kontaminasi (RQ2 &amp; RQ3)</text>
    
    <rect x="585" y="275" width="160" height="22" rx="4" fill="#ffffff"/>
    <text x="665" y="291" fill="#0284c7" font-family="'Times New Roman', Georgia, serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.04em">★ KONTRIBUSI UTAMA</text>
    
    <circle cx="44" cy="319" r="3" fill="#0284c7"/>
    <text x="56" y="323" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="13" font-weight="bold">Pembagian temporal kronologis murni 80/20 tanpa pengacakan (strictly no random shuffling)</text>
    
    <circle cx="44" cy="337" r="3" fill="#0284c7"/>
    <text x="56" y="341" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="13">Data latih: 1.104 hari (2020 s.d. 8 Jan 2023) | Data uji unseen: 276 hari (9 Jan s.d. 11 Okt 2023)</text>
    
    <circle cx="44" cy="355" r="3" fill="#0284c7"/>
    <text x="56" y="359" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="13">Penskalaan train-only bebas kontaminasi &amp; validasi silang walk-forward (expanding window) 5-lipatan</text>
  </g>

  <!-- ==================================================== -->
  <!-- FASE 4: Evaluasi vs Baseline                         -->
  <!-- ==================================================== -->
  <g id="fase-4">
    <rect x="25" y="400" width="730" height="105" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <path d="M 25 406 Q 25 400 31 400 L 749 400 Q 755 400 755 406 L 755 430 L 25 430 Z" fill="#0f172a"/>
    <text x="40" y="421" fill="#ffffff" font-family="'Times New Roman', Georgia, serif" font-size="14.5" font-weight="bold" letter-spacing="0.02em">FASE 4: Evaluasi Model vs Baseline Pembanding Objektif (RQ2 &amp; RQ3)</text>
    
    <circle cx="44" cy="447" r="3" fill="#0f172a"/>
    <text x="56" y="451" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="13">Peramalan: Polinomial (Ordo 1–3) vs Baseline Naif Rata-rata Latih, Nilai Akhir, &amp; Persistence</text>
    
    <circle cx="44" cy="465" r="3" fill="#0f172a"/>
    <text x="56" y="469" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="13">Evaluasi R² out-of-sample data uji unseen (pembuktian divergensi ekstrapolasi polinomial R² ≤ 0)</text>
    
    <circle cx="44" cy="483" r="3" fill="#0f172a"/>
    <text x="56" y="487" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="13">Klasifikasi: Random Forest (300 pohon) vs Baseline Acak (1/3) &amp; Uji Binomial Tepat (p > 0,35)</text>
  </g>
</svg>
