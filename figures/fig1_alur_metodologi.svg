<svg viewBox="0 0 780 570" width="780" height="570" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram Alur Metodologi Modular 4-Fase Kerangka Evaluasi Empiris Bebas Kontaminasi Data">
  <defs>
    <marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0f172a"/>
    </marker>
    <marker id="arrow-sky" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Canvas Solid Fill (Pure White) -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ==================================================== -->
  <!-- CONNECTING ARROWS                                    -->
  <!-- ==================================================== -->
  <line x1="390" y1="137" x2="390" y2="161" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arrow-dark)"/>
  <line x1="390" y1="273" x2="390" y2="297" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrow-sky)"/>
  <line x1="390" y1="409" x2="390" y2="433" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrow-sky)"/>

  <!-- ==================================================== -->
  <!-- FASE 1: Ingesti Data & Audit Distribusi Statistik    -->
  <!-- ==================================================== -->
  <g id="card-fase-1">
    <rect x="30" y="25" width="720" height="112" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <path d="M 30 31 Q 30 25 36 25 L 744 25 Q 750 25 750 31 L 750 53 L 30 53 Z" fill="#0f172a"/>
    <text x="44" y="44" fill="#ffffff" font-family="'Times New Roman', Georgia, serif" font-size="13.5" font-weight="bold" letter-spacing="0.02em">FASE 1: INGESTI DATA &amp; AUDIT DISTRIBUSI STATISTIK (RQ1)</text>
    
    <circle cx="48" cy="74" r="3" fill="#0f172a"/>
    <text x="58" y="78" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="12.5">Korpus 40.000 log keamanan siber publik (rentang waktu 1.380 hari kalender, 25 atribut heterogen)</text>
    
    <circle cx="48" cy="97" r="3" fill="#0f172a"/>
    <text x="58" y="101" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="12.5">Audit integritas data &amp; eksplorasi batas pencilan IQR [LB, UB] (0 timestamp cacat, 0 baris duplikat)</text>
    
    <circle cx="48" cy="120" r="3" fill="#0f172a"/>
    <text x="58" y="124" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="12.5">13 Uji Goodness-of-Fit univariat (Chi-Square &amp; Kolmogorov-Smirnov) vs seragam (α_adj = 0,0038)</text>
  </g>

  <!-- ==================================================== -->
  <!-- FASE 2: Karakterisasi Struktur Temporal Deret Waktu  -->
  <!-- ==================================================== -->
  <g id="card-fase-2">
    <rect x="30" y="161" width="720" height="112" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <path d="M 30 167 Q 30 161 36 161 L 744 161 Q 750 161 750 167 L 750 189 L 30 189 Z" fill="#0f172a"/>
    <text x="44" y="180" fill="#ffffff" font-family="'Times New Roman', Georgia, serif" font-size="13.5" font-weight="bold" letter-spacing="0.02em">FASE 2: KARAKTERISASI STRUKTUR TEMPORAL DERET WAKTU (RQ2)</text>
    
    <circle cx="48" cy="210" r="3" fill="#0f172a"/>
    <text x="58" y="214" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="12.5">Agregasi frekuensi serangan harian deret waktu (DDoS, Malware, Intrusion) selama 1.380 hari</text>
    
    <circle cx="48" cy="233" r="3" fill="#0f172a"/>
    <text x="58" y="237" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="12.5">Uji dispersi Poisson (evaluasi rasio varians/rata-rata s²/x̄ ≈ 1 sebagai sifat proses tanpa memori)</text>
    
    <circle cx="48" cy="256" r="3" fill="#0f172a"/>
    <text x="58" y="260" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="12.5">Analisis autokorelasi serial ACF (lag 1–20), uji portmanteau Ljung-Box, &amp; uji tren Mann-Kendall</text>
  </g>

  <!-- ==================================================== -->
  <!-- FASE 3: Partisi Temporal Bebas Kontaminasi (FOCAL)    -->
  <!-- ==================================================== -->
  <g id="card-fase-3">
    <rect x="30" y="297" width="720" height="112" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2.2"/>
    <path d="M 30 303 Q 30 297 36 297 L 744 297 Q 750 297 750 303 L 750 325 L 30 325 Z" fill="#0284c7"/>
    <text x="44" y="316" fill="#ffffff" font-family="'Times New Roman', Georgia, serif" font-size="13.5" font-weight="bold" letter-spacing="0.02em">FASE 3: PROTOKOL PARTISI TEMPORAL BEBAS KONTAMINASI (RQ2 &amp; RQ3)</text>
    
    <!-- Chip Badge -->
    <rect x="580" y="301" width="160" height="20" rx="3" fill="#ffffff"/>
    <text x="660" y="315" fill="#0284c7" font-family="'Times New Roman', Georgia, serif" font-size="10.5" font-weight="bold" text-anchor="middle" letter-spacing="0.03em">★ KONTRIBUSI UTAMA</text>
    
    <circle cx="48" cy="346" r="3" fill="#0284c7"/>
    <text x="58" y="350" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="12.5" font-weight="bold">Pembagian temporal kronologis murni 80/20 tanpa pengacakan (strictly no random shuffling)</text>
    
    <circle cx="48" cy="369" r="3" fill="#0284c7"/>
    <text x="58" y="373" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="12.5">Data latih: 1.104 hari (2020 s.d. 8 Jan 2023) | Data uji unseen: 276 hari (9 Jan s.d. 11 Okt 2023)</text>
    
    <circle cx="48" cy="392" r="3" fill="#0284c7"/>
    <text x="58" y="396" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="12.5">Penskalaan train-only bebas kontaminasi &amp; validasi silang walk-forward (expanding window) 5-lipatan</text>
  </g>

  <!-- ==================================================== -->
  <!-- FASE 4: Evaluasi Model vs Baseline Pembanding        -->
  <!-- ==================================================== -->
  <g id="card-fase-4">
    <rect x="30" y="433" width="720" height="112" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <path d="M 30 439 Q 30 433 36 433 L 744 433 Q 750 433 750 439 L 750 461 L 30 461 Z" fill="#0f172a"/>
    <text x="44" y="452" fill="#ffffff" font-family="'Times New Roman', Georgia, serif" font-size="13.5" font-weight="bold" letter-spacing="0.02em">FASE 4: EVALUASI MODEL VS BASELINE PEMBANDING OBJEKTIF (RQ2 &amp; RQ3)</text>
    
    <circle cx="48" cy="482" r="3" fill="#0f172a"/>
    <text x="58" y="486" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="12.5">Peramalan: Polinomial (Ordo 1–3) vs Baseline Naif Rata-rata Latih, Nilai Akhir, &amp; Persistence</text>
    
    <circle cx="48" cy="505" r="3" fill="#0f172a"/>
    <text x="58" y="509" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="12.5">Evaluasi R² out-of-sample data uji unseen (pembuktian divergensi ekstrapolasi polinomial R² ≤ 0)</text>
    
    <circle cx="48" cy="528" r="3" fill="#0f172a"/>
    <text x="58" y="532" fill="#0f172a" font-family="'Times New Roman', Georgia, serif" font-size="12.5">Klasifikasi: Random Forest (300 pohon) vs Baseline Acak (1/3) &amp; Uji Binomial Tepat (p &gt; 0,35)</text>
  </g>
</svg>
