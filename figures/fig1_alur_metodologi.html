<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Diagram Alur Metodologi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      width: 740px;
      height: 538px;
      overflow: hidden;
    }
    svg {
      display: block;
      width: 740px;
      height: 538px;
    }
  </style>
</head>
<body>
<svg viewBox="0 0 740 538" width="740" height="538" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram Alur Metodologi 4-Fase dengan Penanda Kebaruan">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
  </defs>

  <!-- Canvas: Pure Solid White -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Connecting Arrows -->
  <line x1="370" y1="122" x2="370" y2="143" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="370" y1="248" x2="370" y2="269" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="370" y1="374" x2="370" y2="395" stroke="#000000" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- FASE 1 -->
  <g id="fase-1">
    <rect x="25" y="18" width="690" height="104" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <line x1="25" y1="44" x2="715" y2="44" stroke="#000000" stroke-width="0.9"/>
    <text x="38" y="36" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">FASE 1: Ingesti Data &amp; Audit Distribusi Statistik (RQ1)</text>
    <text x="38" y="64" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="11">• Korpus 40.000 log keamanan siber publik (rentang waktu 1.380 hari kalender, 25 atribut heterogen)</text>
    <text x="38" y="84" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="11">• Audit integritas data &amp; batas pencilan IQR [LB, UB] (0 timestamp cacat, 0 baris duplikat)</text>
    <text x="38" y="104" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="11">• 13 Uji Goodness-of-Fit univariat (Chi-Square &amp; Kolmogorov-Smirnov) vs seragam (α_adj = 0,0038)</text>
  </g>

  <!-- FASE 2 -->
  <g id="fase-2">
    <rect x="25" y="144" width="690" height="104" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <line x1="25" y1="170" x2="715" y2="170" stroke="#000000" stroke-width="0.9"/>
    <text x="38" y="162" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">FASE 2: Karakterisasi Struktur Temporal Deret Waktu (RQ2)</text>
    <text x="38" y="190" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="11">• Agregasi frekuensi serangan harian deret waktu (DDoS, Malware, Intrusion) selama 1.380 hari</text>
    <text x="38" y="210" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="11">• Uji dispersi Poisson (evaluasi rasio varians/rata-rata s²/x̄ ≈ 1 sebagai proses tanpa memori)</text>
    <text x="38" y="230" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="11">• Analisis autokorelasi serial ACF (lag 1–20), uji portmanteau Ljung-Box, &amp; uji tren Mann-Kendall</text>
  </g>

  <!-- FASE 3 (KEBARUAN / NOVELTY) -->
  <g id="fase-3">
    <rect x="25" y="270" width="690" height="104" fill="#f3f4f6" stroke="#000000" stroke-width="2.2"/>
    <line x1="25" y1="296" x2="715" y2="296" stroke="#000000" stroke-width="1.2"/>
    <text x="38" y="288" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">FASE 3: Protokol Pemisahan Data Murni Tanpa Pencampuran (RQ2 &amp; RQ3)</text>
    
    <!-- Solid High-Contrast Novelty Badge -->
    <rect x="572" y="274" width="136" height="18" fill="#000000"/>
    <text x="640" y="287" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="0.03em">★ KEBARUAN UTAMA</text>
    
    <text x="38" y="316" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">• Pembagian temporal kronologis murni 80/20 tanpa pengacakan (strictly no random shuffling)</text>
    <text x="38" y="336" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="11">• Data latih: 1.104 hari (2020 s.d. 8 Jan 2023) | Data uji unseen: 276 hari (9 Jan s.d. 11 Okt 2023)</text>
    <text x="38" y="356" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="11">• Penskalaan train-only terisolasi &amp; validasi silang walk-forward (expanding window) 5-lipatan</text>
  </g>

  <!-- FASE 4 -->
  <g id="fase-4">
    <rect x="25" y="396" width="690" height="104" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <line x1="25" y1="422" x2="715" y2="422" stroke="#000000" stroke-width="0.9"/>
    <text x="38" y="414" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold">FASE 4: Evaluasi Model vs Baseline Pembanding Objektif (RQ2 &amp; RQ3)</text>
    <text x="38" y="442" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="11">• Peramalan: Polinomial (Ordo 1–3) vs Baseline Naif Rata-rata Latih, Nilai Akhir, &amp; Persistence</text>
    <text x="38" y="462" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="11">• Evaluasi R² out-of-sample data uji unseen (pembuktian divergensi ekstrapolasi polinomial R² ≤ 0)</text>
    <text x="38" y="482" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="11">• Klasifikasi: Random Forest (300 pohon) vs Baseline Acak (1/3) &amp; Uji Binomial Tepat (p &gt; 0,35)</text>
  </g>

  <!-- Legend Note -->
  <text x="370" y="522" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" text-anchor="middle">Keterangan: Kotak berbingkai tebal dengan label [★ KEBARUAN UTAMA] menandai kontribusi kebaruan metodologis penelitian ini.</text>
</svg>

</body>
</html>
